<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MaCo 軸確認ツール</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #14161a;
    --border: #262a30;
    --text: #e8e8e8;
    --sub: #8a8f98;
    --accent: #4fd1c5;
    --good: #4ade80;
    --warn: #fbbf24;
    --bad: #f87171;
    --gx-color: #f87171;
    --gy-color: #4ade80;
    --gz-color: #60a5fa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Hiragino Sans", "Segoe UI", sans-serif;
    padding: 12px;
  }
  h1 { font-size: 17px; margin: 0 0 4px 0; display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); flex-shrink: 0; }
  .dot.connected { background: var(--good); }
  p.sub { font-size: 11px; color: var(--sub); margin: 0 0 12px 0; }

  button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: #0a0a0a; border: none; font-weight: 600; }
  button:disabled { opacity: 0.4; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 12px;
  }
  .panel h2 {
    font-size: 13px; color: var(--sub); margin: 0 0 8px 0;
    text-transform: uppercase; letter-spacing: 0.05em;
  }

  #chartWrap { height: 220px; }

  .live-vals { display: flex; gap: 8px; margin-top: 10px; }
  .live-val { flex: 1; text-align: center; padding: 8px; background: #1a1d22; border-radius: 8px; }
  .live-val .axis-label { font-size: 11px; font-weight: 700; }
  .live-val .axis-num { font-size: 18px; font-weight: 700; margin-top: 2px; }
  .live-val.gx .axis-label { color: var(--gx-color); }
  .live-val.gy .axis-label { color: var(--gy-color); }
  .live-val.gz .axis-label { color: var(--gz-color); }

  .test-btn {
    width: 100%;
    padding: 14px;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 8px;
    border-radius: 10px;
  }
  .test-btn.recording {
    background: var(--warn);
    color: #0a0a0a;
    border: none;
  }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { padding: 6px 4px; text-align: center; border-bottom: 1px solid var(--border); }
  th { color: var(--sub); font-weight: 500; font-size: 10px; }
  td.dominant { font-weight: 700; }
  td.gx-dom { color: var(--gx-color); }
  td.gy-dom { color: var(--gy-color); }
  td.gz-dom { color: var(--gz-color); }

  .result-summary {
    font-size: 13px;
    padding: 10px;
    background: #1a1d22;
    border-radius: 8px;
    margin-top: 10px;
    line-height: 1.6;
  }
</style>
</head>
<body>

<h1><span class="dot" id="connDot"></span>MaCo 軸確認ツール</h1>
<p class="sub">銃口の動作とGyroX/Y/Zの対応関係を実機で確認するための診断アプリ</p>

<div class="panel" style="padding:10px 12px;">
  <button class="primary" id="btnConnect" style="width:100%;">BLE接続</button>
</div>

<div class="panel">
  <h2>リアルタイム角速度</h2>
  <div id="chartWrap"><canvas id="liveChart"></canvas></div>
  <div class="live-vals">
    <div class="live-val gx"><div class="axis-label">GyroX</div><div class="axis-num" id="valGx">--</div></div>
    <div class="live-val gy"><div class="axis-label">GyroY</div><div class="axis-num" id="valGy">--</div></div>
    <div class="live-val gz"><div class="axis-label">GyroZ</div><div class="axis-num" id="valGz">--</div></div>
  </div>
</div>

<div class="panel">
  <h2>動作テスト</h2>
  <p class="sub" style="margin-top:-4px;">
    各ボタンを押している間だけ記録します。指示された動作をゆっくり行ってください。
  </p>
  <button class="test-btn" id="btnTestUpDown" disabled>① 銃口を上に振る（押している間、上げ続ける）</button>
  <button class="test-btn" id="btnTestLeftRight" disabled>② 銃口を右に振る（押している間、右に振り続ける）</button>
  <button class="test-btn" id="btnTestRoll" disabled>③ 銃身軸で時計回りにロール（射手から見て時計回り）</button>
</div>

<div class="panel">
  <h2>テスト結果</h2>
  <table>
    <thead>
      <tr><th>動作</th><th>GyroX<br>符号付き値</th><th>GyroY<br>符号付き値</th><th>GyroZ<br>符号付き値</th><th>支配軸</th></tr>
    </thead>
    <tbody id="resultTable"></tbody>
  </table>
  <div class="result-summary" id="resultSummary">
    3つのテストを実施すると、ここに軸の対応関係のまとめが表示されます。
  </div>
</div>

<script>
// =========================================================
// MaCo 軸確認ツール
// 既存アプリと同一のBLE仕様(M5StickS3, 6軸IMU 100Hz)を使い、
// 銃口の動作とGyroX/Y/Zの対応関係を実機で確認するための診断専用アプリ。
// 採点・記録機能は持たず、動作中の各軸の振幅を比較するのみ。
// =========================================================

const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const CHAR_UUID    = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
const PACKET_SIZE = 28;

let device = null, gattChar = null;
let latestSample = null;

const MAX_POINTS = 300; // 3秒分@100Hz相当
const ctx = document.getElementById('liveChart').getContext('2d');
const chart = new Chart(ctx, {
  type: 'line',
  data: {
    labels: [],
    datasets: [
      { label: 'GyroX', data: [], borderColor: '#f87171', pointRadius: 0, borderWidth: 1.5 },
      { label: 'GyroY', data: [], borderColor: '#4ade80', pointRadius: 0, borderWidth: 1.5 },
      { label: 'GyroZ', data: [], borderColor: '#60a5fa', pointRadius: 0, borderWidth: 1.5 },
    ]
  },
  options: {
    animation: false,
    responsive: true,
    maintainAspectRatio: false,
    scales: {
      x: { display: false },
      y: { title: { display: true, text: 'deg/s', color: '#8a8f98' }, grid: { color: '#262a30' }, ticks: { color: '#8a8f98' } }
    },
    plugins: { legend: { labels: { color: '#e8e8e8' } } }
  }
});

// ---- BLE接続 ----
document.getElementById('btnConnect').addEventListener('click', connectBle);

async function connectBle() {
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE_UUID] }]
    });
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    gattChar = await service.getCharacteristic(CHAR_UUID);
    await gattChar.startNotifications();
    gattChar.addEventListener('characteristicvaluechanged', onImuData);
    device.addEventListener('gattserverdisconnected', () => setConnected(false));
    setConnected(true);
  } catch (err) {
    console.error('BLE接続エラー:', err);
    alert('BLE接続に失敗しました: ' + err.message);
  }
}

function setConnected(connected) {
  document.getElementById('connDot').classList.toggle('connected', connected);
  document.getElementById('btnConnect').textContent = connected ? '接続中' : 'BLE接続';
  document.getElementById('btnConnect').disabled = connected;
  ['btnTestUpDown','btnTestLeftRight','btnTestRoll'].forEach(id => {
    document.getElementById(id).disabled = !connected;
  });
}

function onImuData(event) {
  const dv = event.target.value;
  if (dv.byteLength < PACKET_SIZE) return;

  const t = dv.getUint32(0, true);
  const gx = dv.getFloat32(4, true);
  const gy = dv.getFloat32(8, true);
  const gz = dv.getFloat32(12, true);
  // Accelは今回の軸確認には使わないため読み飛ばし対象だが、パケット構造上は取得しておく
  const ax = dv.getFloat32(16, true);
  const ay = dv.getFloat32(20, true);
  const az = dv.getFloat32(24, true);

  latestSample = { t, gx, gy, gz, ax, ay, az };
  updateChart(latestSample);
  updateLiveVals(latestSample);

  if (currentTest) {
    currentTest.samples.push(latestSample);
  }
}

function updateChart(s) {
  chart.data.labels.push('');
  chart.data.datasets[0].data.push(s.gx);
  chart.data.datasets[1].data.push(s.gy);
  chart.data.datasets[2].data.push(s.gz);
  if (chart.data.labels.length > MAX_POINTS) {
    chart.data.labels.shift();
    chart.data.datasets.forEach(d => d.data.shift());
  }
  chart.update('none');
}

function updateLiveVals(s) {
  document.getElementById('valGx').textContent = s.gx.toFixed(1);
  document.getElementById('valGy').textContent = s.gy.toFixed(1);
  document.getElementById('valGz').textContent = s.gz.toFixed(1);
}

// ---- 動作テスト（ボタン押下中のみ記録） ----
let currentTest = null; // { label, samples: [] }
const testResults = []; // { label, maxGx, maxGy, maxGz, dominant }

function bindTestButton(id, label) {
  const btn = document.getElementById(id);
  const start = () => {
    currentTest = { label, samples: [] };
    btn.classList.add('recording');
  };
  const stop = () => {
    if (!currentTest) return;
    btn.classList.remove('recording');
    finalizeTest(currentTest);
    currentTest = null;
  };
  // タッチ/マウス両対応：押している間だけ記録する
  btn.addEventListener('mousedown', start);
  btn.addEventListener('touchstart', (e) => { e.preventDefault(); start(); });
  btn.addEventListener('mouseup', stop);
  btn.addEventListener('mouseleave', stop);
  btn.addEventListener('touchend', (e) => { e.preventDefault(); stop(); });
}

bindTestButton('btnTestUpDown', '① 上に振る');
bindTestButton('btnTestLeftRight', '② 右に振る');
bindTestButton('btnTestRoll', '③ 時計回りロール');

// 符号付きの値のうち、絶対値が最大の瞬間の値をそのまま返す（符号を保持するため）
function signedPeak(samples, key) {
  return samples.reduce((a, s) => Math.abs(s[key]) > Math.abs(a) ? s[key] : a, 0);
}

function finalizeTest(test) {
  if (test.samples.length < 3) {
    alert('記録データが少なすぎます。ボタンを押しながら動作をもう少し長く行ってください。');
    return;
  }
  const peakGx = signedPeak(test.samples, 'gx');
  const peakGy = signedPeak(test.samples, 'gy');
  const peakGz = signedPeak(test.samples, 'gz');

  const vals = { gx: Math.abs(peakGx), gy: Math.abs(peakGy), gz: Math.abs(peakGz) };
  const dominant = Object.keys(vals).reduce((a, b) => vals[a] > vals[b] ? a : b);

  testResults.push({ label: test.label, peakGx, peakGy, peakGz, dominant });
  renderResults();
}

function renderResults() {
  const tbody = document.getElementById('resultTable');
  tbody.innerHTML = testResults.map(r => `
    <tr>
      <td>${r.label}</td>
      <td class="${r.dominant==='gx'?'dominant gx-dom':''}">${r.peakGx >= 0 ? '+' : ''}${r.peakGx.toFixed(1)}</td>
      <td class="${r.dominant==='gy'?'dominant gy-dom':''}">${r.peakGy >= 0 ? '+' : ''}${r.peakGy.toFixed(1)}</td>
      <td class="${r.dominant==='gz'?'dominant gz-dom':''}">${r.peakGz >= 0 ? '+' : ''}${r.peakGz.toFixed(1)}</td>
      <td class="${r.dominant}-dom dominant">${ {gx:'GyroX',gy:'GyroY',gz:'GyroZ'}[r.dominant] }</td>
    </tr>
  `).join('');

  const summaryEl = document.getElementById('resultSummary');
  if (testResults.length >= 3) {
    const byLabel = {};
    testResults.forEach(r => { byLabel[r.label] = r; }); // 同じ動作を複数回試した場合は最後の結果を使う
    const lines = Object.values(byLabel).map(r => {
      const dominantVal = { gx: r.peakGx, gy: r.peakGy, gz: r.peakGz }[r.dominant];
      const sign = dominantVal >= 0 ? '+' : '-';
      return `${r.label} → 最も反応したのは <b>${ {gx:'GyroX',gy:'GyroY',gz:'GyroZ'}[r.dominant] }</b>（符号: ${sign}、値: ${dominantVal.toFixed(1)}）`;
    });
    summaryEl.innerHTML = lines.join('<br>');
  } else {
    summaryEl.textContent = `あと${3 - new Set(testResults.map(r=>r.label)).size}種類のテストを行うと、まとめが表示されます。`;
  }
}
</script>
</body>
</html>
